# Paths included in the module backup (state/environment is always included).
#   state/passwords.env  generated secrets (DB, master and LDAP bind password)
#   state/pgdump         per-database pg_dump files written by module-dump-state
#   odoo-data            Odoo filestore (attachments, assets)
#   odoo-addons          extra / OCA add-ons dropped in by the admin
# The live PostgreSQL data directory (odoo-pgdata) is NOT copied: a file-level
# copy of a running cluster is not consistent. restore-module rebuilds it from
# the dumps.
state/passwords.env
state/pgdump
volumes/odoo-data
volumes/odoo-addons
